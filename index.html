<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Clever l Portal</title>

  <style>
    body {
      background: #0d0d0f;
      color: #e5e5e5;
      font-family: "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 20px;
      color: #7ab8ff;
      text-shadow: 0 0 10px #1e90ff;
    }

    #statusBox {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      border-radius: 10px;
      background: #1a1a1d;
      margin-bottom: 25px;
      box-shadow: 0 0 12px rgba(0, 150, 255, 0.3);
    }

    #statusLight {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
    }

    #statusText {
      font-size: 18px;
    }

    .btn {
      padding: 15px 40px;
      margin: 10px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #1f1f22;
      color: white;
      transition: 0.2s;
      box-shadow: 0 0 10px rgba(0, 150, 255, 0.2);
    }

    .btn:hover {
      background: #2a2a2e;
      box-shadow: 0 0 15px rgba(0, 150, 255, 0.4);
    }

    #method {
      margin-bottom: 20px;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 8px;
      background: #1f1f22;
      color: white;
      border: none;
      box-shadow: 0 0 10px rgba(0, 150, 255, 0.2);
    }
  </style>
</head>

<body>

  <h1>Clever l Portal</h1>

  <div id="statusBox">
    <div id="statusLight"></div>
    <div id="statusText">Ready</div>
  </div>

  <select id="method">
    <option value="normal">Normal</option>
    <option value="waves">Waves</option>
  </select>

  <button class="btn" id="btn25">Open 25 Tabs</button>
  <button class="btn" id="btn50">Open 50 Tabs</button>
  <button class="btn" id="btn100">Open 100 Tabs</button>

 <script>
  // List of search topics (safe + educational)
  const searchTerms = [
    "math practice",
    "science facts",
    "history timeline",
    "coding for beginners",
    "solar system info",
    "grammar exercises",
    "geography quiz",
    "reading comprehension",
    "typing lessons",
    "biology basics",
    "chemistry intro",
    "algebra help",
    "geometry problems",
    "world capitals",
    "famous inventors",
    "study tips",
    "earth science",
    "physics basics",
    "english vocabulary",
    "computer science basics",
    "space exploration",
    "weather and climate",
    "ecosystems",
    "ancient civilizations",
    "art history"
  ];

  const statusLight = document.getElementById("statusLight");
  const statusText = document.getElementById("statusText");
  const methodSelect = document.getElementById("method");

  function setStatus(text, color) {
    statusText.textContent = text;
    statusLight.style.background = color;
    statusLight.style.boxShadow = `0 0 10px ${color}`;
  }

  // Build a unique Google search URL
  function buildSearchURL(term, index) {
    return `https://www.google.com/search?q=${encodeURIComponent(term)}&id=${index}`;
  }

  async function launchTabs(count) {
    const method = methodSelect.value;

    setStatus("Made by Bentley...", "#3b82f6");
    await new Promise(res => setTimeout(res, 2000));

    if (method === "normal") {
      setStatus("Opening tabs...", "#22c55e");

      for (let i = 0; i < count; i++) {
        const term = searchTerms[i % searchTerms.length];
        const url = buildSearchURL(term, i);
        window.open(url, "_blank");
      }
    }

    if (method === "waves") {
      setStatus("Opening in waves...", "#22c55e");

      let opened = 0;
      const waveSize = 5;

      while (opened < count) {
        for (let i = 0; i < waveSize && opened < count; i++) {
          const term = searchTerms[opened % searchTerms.length];
          const url = buildSearchURL(term, opened);
          window.open(url, "_blank");
          opened++;
        }
        await new Promise(res => setTimeout(res, 300));
      }
    }

    setStatus("Ready", "#22c55e");
  }

  document.getElementById("btn25").onclick = () => launchTabs(25);
  document.getElementById("btn50").onclick = () => launchTabs(50);
  document.getElementById("btn100").onclick = () => launchTabs(100);
</script>

</body> 
</html>
